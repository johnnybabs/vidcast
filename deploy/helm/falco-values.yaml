# Falco Helm values for VidCast (S2.6 — runtime threat detection).
#
# PRE-INSTALL CHECKLIST (do before helm install):
# 1. Run: terraform apply -target=module.falco_alerting
# 2. Confirm the subscription email sent to baabalola@gmail.com
# 3. Fill in the two ARN placeholders below with terraform output values:
#      terraform output -raw falco_alerts_topic_arn
#      terraform output -raw falcosidekick_role_arn
#
# Deploy command (after checklist above — run only after human review):
#   helm repo add falcosecurity https://falcosecurity.github.io/charts
#   helm repo update
#   helm install falco falcosecurity/falco \
#     --namespace default \
#     --values deploy/helm/falco-values.yaml
#
# Upgrade after a rule or value change:
#   helm upgrade falco falcosecurity/falco \
#     --namespace default \
#     --values deploy/helm/falco-values.yaml
#
# Verify (Done when):
#   kubectl exec -n default deploy/gateway -- /bin/sh
#   → should produce an SNS email alert within 10 seconds

driver:
  # modern_ebpf: CO-RE eBPF, no kernel module compilation, EKS-compatible.
  # Node drain and restart are NOT needed to install this driver.
  kind: modern_ebpf

falco:
  rulesFiles:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d/

  # JSON output makes log shipping (Fluent Bit → CloudWatch, Sprint S4) work
  # without extra parsing.
  jsonOutput: true
  logLevel: info

# Mount the VidCast custom rules file into /etc/falco/rules.d/
# This block is the deployed version; deploy/falco/vidcast-rules.yaml is the
# annotated source. Keep them in sync — update both together.
customRules:
  vidcast-rules.yaml: |
    - macro: vidcast_app_pods
      condition: >
        k8s.ns.name = "default" and
        k8s.pod.label.app in (converter, gateway, auth, notification)

    - macro: converter_pod
      condition: >
        k8s.ns.name = "default" and
        k8s.pod.label.app = "converter"

    - macro: mongodb_service_ips
      condition: (fd.sip = "172.20.48.19")

    - macro: rabbitmq_service_ips
      condition: (fd.sip = "172.20.204.189")

    - macro: redis_service_ips
      condition: (fd.sip = "172.20.54.127")

    - macro: converter_expected_destinations
      condition: >
        (mongodb_service_ips or rabbitmq_service_ips or redis_service_ips)

    - rule: Shell spawned in VidCast application pod
      desc: >
        A shell was spawned in a converter, gateway, auth, or notification pod.
        These pods run gunicorn/Python workers and never exec a shell in normal
        operation. Any shell spawn indicates likely container escape or exploit.
      condition: >
        spawned_process and
        proc.name in (shell_binaries) and
        vidcast_app_pods
      output: >
        Shell spawned in VidCast pod
        (pod=%k8s.pod.name app=%k8s.pod.label.app ns=%k8s.ns.name
         user=%user.name cmd=%proc.cmdline parent=%proc.pname)
      priority: CRITICAL
      tags: [vidcast, shell-spawn, T1059]

    - rule: Unexpected outbound connection from converter
      desc: >
        The converter pod made an outbound TCP connection to a destination
        other than its three expected services (MongoDB, RabbitMQ, Redis).
        The converter processes untrusted user-uploaded video files via FFmpeg;
        an FFmpeg exploit that achieves RCE would trigger this rule when the
        attacker attempts to exfiltrate data or reach a C2 server. This is the
        specific risk Falco closes that GuardDuty cannot (GuardDuty operates at
        the AWS API level, not inside the container kernel).
      condition: >
        outbound and
        converter_pod and
        not converter_expected_destinations and
        not fd.sip in ("127.0.0.1", "::1")
      output: >
        Converter unexpected outbound connection
        (pod=%k8s.pod.name dest=%fd.sip:%fd.sport
         cmd=%proc.cmdline user=%user.name)
      priority: CRITICAL
      tags: [vidcast, exfiltration, converter, T1041]

    - rule: Write to /etc in VidCast application pod
      desc: >
        A process wrote to /etc inside a VidCast application pod. Application
        pods run as non-root (UID 1000) with readOnlyRootFilesystem; a write
        to /etc indicates either a privilege escalation or a rootkit attempting
        to persist by modifying system files.
      condition: >
        open_write and
        fd.name startswith /etc and
        vidcast_app_pods
      output: >
        Write to /etc in VidCast pod
        (pod=%k8s.pod.name app=%k8s.pod.label.app
         file=%fd.name user=%user.name cmd=%proc.cmdline)
      priority: HIGH
      tags: [vidcast, rootkit, privilege-escalation, T1543]

falcosidekick:
  enabled: true

  config:
    aws:
      # IRSA — when useirsa=true the chart annotates the falco-falcosidekick
      # ServiceAccount with rolearn automatically. The pod's AWS SDK picks up
      # short-lived credentials via the projected service account token; no
      # long-lived AWS keys are stored anywhere. The IRSA role allows only
      # sns:Publish on the vidcast-falco-alerts topic, nothing broader.
      useirsa: true
      rolearn: "REPLACE_WITH_FALCOSIDEKICK_ROLE_ARN"
      # ↑ terraform output -raw falcosidekick_role_arn
      # → arn:aws:iam::501562869470:role/vidcast-cluster-falcosidekick-irsa
      region: "eu-west-2"

      # Route all Falco alerts to the vidcast-falco-alerts SNS topic.
      # On-call receives the same email thread for both Falco kernel-level events
      # and AWS-level events (GuardDuty SNS, when enabled in Sprint S2.4).
      sns:
        topicarn: "REPLACE_WITH_FALCO_SNS_TOPIC_ARN"
        # ↑ terraform output -raw falco_alerts_topic_arn
        # → arn:aws:sns:eu-west-2:501562869470:vidcast-falco-alerts
        minimumpriority: "warning"  # suppress DEBUG/INFO; deliver WARNING and above

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# DaemonSet is additive — installing Falco does not restart existing pods.
# The eBPF driver attaches to the running kernel; no node drain required.
